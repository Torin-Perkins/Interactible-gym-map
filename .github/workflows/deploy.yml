name: Deploy site

# Builds drive-data.json from the shared USAPT Data Drive folder and publishes it with the
# site to GitHub Pages. The data file is only part of the Pages deploy, never committed.
# Requires repo Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, to pick up new files in the folder
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.2 openpyxl==3.1.5
      - run: python scripts/build_drive_data.py drive-data.json
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css data.js sources.js app.js stats.js rates.js usapt-logo.png drive-data.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
